name: Push to Google Apps Script

# 合併到 main 分支後，自動用 clasp 把程式碼推送到真正的 Google Apps Script
# 專案，不用再手動跑 `git pull && clasp push`。跟 tsaipeilinebot repo 底下
# delivery-gas-project 那組自動化是同一套做法，設定步驟見 tsaipeilinebot
# 專案的 HANDOFF.md「CI/CD 自動部署」章節。
#
# 需要先在 GitHub 這個 repo 的 Settings → Secrets and variables → Actions
# 設定一個叫 CLASPRC_JSON 的 secret（`clasp login` 產生的 ~/.clasprc.json
# 內容，base64 編碼後貼上，避免複製貼上時混進換行符號把 JSON 弄壞）。
#
# 【2026-09-22 確認】：這個 Apps Script 專案的 Web App 部署，材霈平台
# （`tsaipeilinebot` 的 `JOB_PORTAL_GAS_WEBAPP_URL` 環境變數）實際打的是
# 綁定「固定版本」的部署（deployment id
# AKfycbwi-j_mbnUDRFPKyEvL7arPv9UzHqpJLoNf9xHMOZTIf2yPN-ob5gDyFvwxKU63mIhVIA，
# 對照 `clasp deployments` 列出的說明是「薪資補款：新增PDF存查單附件」那筆），
# 不是 @HEAD——跟 delivery-gas-project 踩過的雷一樣，光 `clasp push` 不會
# 反映到這個固定版本的部署上，一定要多一個 `clasp deploy -i` 步驟才會真的
# 更新，詳見下面那一步。

on:
  push:
    branches:
      - main

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON }}
        run: echo "$CLASPRC_JSON_B64" | base64 -d > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy latest version to the live deployment
        # 材霈平台呼叫的 Web App 網址綁定這個固定版本的部署（不是
        # @HEAD），單純 push 不會反映到這個網址真正執行的程式碼，一定要
        # 額外執行這一步。更新版本不會換掉它的網址，不用跟著改
        # JOB_PORTAL_GAS_WEBAPP_URL 環境變數。
        run: clasp deploy -i AKfycbwi-j_mbnUDRFPKyEvL7arPv9UzHqpJLoNf9xHMOZTIf2yPN-ob5gDyFvwxKU63mIhVIA -d "自動部署 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
